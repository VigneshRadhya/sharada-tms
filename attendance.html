<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Attendance – Shree Sharada TMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous"/>
  <style>

/* ═══════════════════════════════════════════════
   SHREE SHARADA TMS — MASTER STYLESHEET
   Version: 1.0.0
   ═══════════════════════════════════════════════ */

/* ── CSS VARIABLES ── */
:root {
  --bg: #f0f2f8;
  --surface: #ffffff;
  --surface2: #f7f8fc;
  --sidebar-bg: #0f172a;
  --sidebar-hover: #1e293b;
  --sidebar-active: #1d4ed8;
  --sidebar-text: #94a3b8;
  --sidebar-active-text: #ffffff;
  --topnav-bg: #ffffff;
  --text-primary: #0f172a;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --border: #e2e8f0;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
  --shadow-md: 0 4px 16px rgba(0,0,0,.10);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.12);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --font-heading: 'Playfair Display', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --teal:   #0d9488;
  --green:  #16a34a;
  --red:    #dc2626;
  --orange: #ea580c;
  --indigo: #4338ca;
  --purple: #7c3aed;
  --blue:   #2563eb;
  --yellow: #d97706;
  --sidebar-w: 260px;
  --topnav-h: 64px;
  --transition: all 0.25s cubic-bezier(.4,0,.2,1);
}

[data-theme="dark"] {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #1c2128;
  --topnav-bg: #161b22;
  --text-primary: #f0f6fc;
  --text-secondary: #8b949e;
  --text-muted: #6e7681;
  --border: #30363d;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,.4);
}

/* ── BASE ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  transition: var(--transition);
  font-size: 14px;
  line-height: 1.6;
}
a { text-decoration: none; color: inherit; }

/* ══════════════ SIDEBAR ══════════════ */
.sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: var(--sidebar-w);
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  z-index: 1000;
  transition: var(--transition);
  box-shadow: 4px 0 24px rgba(0,0,0,.25);
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 20px 20px 16px;
  border-bottom: 1px solid rgba(255,255,255,.07);
}
.brand-logo {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, #1d4ed8, #7c3aed);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 18px;
  flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(29,78,216,.4);
}
.brand-name { display: block; color: #f1f5f9; font-weight: 600; font-size: 13.5px; line-height: 1.2; }
.brand-sub { display: block; color: var(--sidebar-text); font-size: 11px; }

.sidebar-nav { padding: 12px 0; flex: 1; overflow-y: auto; }
.sidebar-nav::-webkit-scrollbar { width: 4px; }
.sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 2px; }

.nav-group { margin-bottom: 8px; }
.nav-label {
  display: block;
  padding: 10px 20px 4px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.2px;
  color: rgba(148,163,184,.5);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 20px;
  color: var(--sidebar-text);
  border-radius: 0 24px 24px 0;
  margin-right: 12px;
  font-size: 13.5px;
  font-weight: 400;
  transition: var(--transition);
  position: relative;
}
.nav-item i { width: 18px; font-size: 14px; }
.nav-item span:not(.nav-badge) { flex: 1; }
.nav-item:hover { background: var(--sidebar-hover); color: #e2e8f0; }
.nav-item.active {
  background: var(--sidebar-active);
  color: var(--sidebar-active-text);
  font-weight: 500;
  box-shadow: 0 4px 12px rgba(29,78,216,.35);
}
.nav-badge {
  background: rgba(255,255,255,.15);
  color: rgba(255,255,255,.9);
  padding: 2px 7px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 600;
  min-width: 22px;
  text-align: center;
}
.nav-badge.danger { background: #dc2626; }

/* ══════════════ MAIN WRAPPER ══════════════ */
.main-wrapper {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: var(--transition);
}

/* ══════════════ TOP NAV ══════════════ */
.topnav {
  position: sticky; top: 0; z-index: 900;
  height: var(--topnav-h);
  background: var(--topnav-bg);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
}
.topnav-left { display: flex; align-items: center; gap: 16px; }
.sidebar-toggle {
  background: none; border: none; cursor: pointer;
  color: var(--text-secondary); font-size: 18px;
  padding: 6px; border-radius: 8px;
  transition: var(--transition);
}
.sidebar-toggle:hover { background: var(--surface2); color: var(--text-primary); }
.breadcrumb-wrap { display: flex; flex-direction: column; }
.bc-page { font-weight: 600; font-size: 15px; color: var(--text-primary); }
.bc-date { font-size: 11px; color: var(--text-muted); }

.topnav-right { display: flex; align-items: center; gap: 12px; }
.theme-toggle {
  background: var(--surface2); border: 1px solid var(--border);
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-secondary);
  transition: var(--transition); font-size: 14px;
}
.theme-toggle:hover { background: var(--blue); color: white; border-color: var(--blue); }

.notif-btn {
  position: relative; cursor: pointer;
  color: var(--text-secondary); font-size: 18px; padding: 6px;
}
.notif-dot {
  position: absolute; top: 6px; right: 6px;
  width: 8px; height: 8px;
  background: var(--red); border-radius: 50%;
  border: 2px solid var(--topnav-bg);
}

.user-pill {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface2); border: 1px solid var(--border);
  padding: 6px 12px; border-radius: 24px;
  cursor: pointer; transition: var(--transition);
}
.user-pill:hover { box-shadow: var(--shadow-md); }
.user-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  color: white; font-weight: 700; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
}
.user-name { display: block; font-weight: 600; font-size: 13px; color: var(--text-primary); }
.user-role { display: block; font-size: 10px; color: var(--text-muted); }
.user-pill .fa-chevron-down { font-size: 10px; color: var(--text-muted); }

/* ══════════════ PAGE CONTENT ══════════════ */
.page-content { padding: 24px; flex: 1; }

/* ── WELCOME BANNER ── */
.welcome-banner {
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(135deg, #1d4ed8 0%, #7c3aed 100%);
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  margin-bottom: 24px;
  color: white;
  position: relative; overflow: hidden;
}
.welcome-banner::before {
  content: '';
  position: absolute; top: -40px; right: -40px;
  width: 180px; height: 180px;
  background: rgba(255,255,255,.08);
  border-radius: 50%;
}
.welcome-banner::after {
  content: '';
  position: absolute; bottom: -60px; right: 80px;
  width: 130px; height: 130px;
  background: rgba(255,255,255,.05);
  border-radius: 50%;
}
.welcome-banner h2 { font-family: var(--font-heading); font-size: 22px; margin-bottom: 4px; }
.welcome-banner p { opacity: .85; font-size: 13px; }
.welcome-actions { display: flex; gap: 10px; position: relative; z-index: 1; }

.btn-primary-sm, .btn-outline-sm {
  padding: 9px 18px; border-radius: 8px;
  font-size: 13px; font-weight: 500;
  display: flex; align-items: center; gap: 6px;
  cursor: pointer; transition: var(--transition);
  white-space: nowrap;
}
.btn-primary-sm {
  background: white; color: var(--blue);
  box-shadow: 0 4px 12px rgba(0,0,0,.15);
}
.btn-primary-sm:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,0,0,.2); }
.btn-outline-sm {
  background: rgba(255,255,255,.15); color: white;
  border: 1px solid rgba(255,255,255,.35);
  backdrop-filter: blur(4px);
}
.btn-outline-sm:hover { background: rgba(255,255,255,.25); }

/* ── STAT CARDS ── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px;
  display: flex; align-items: center; gap: 16px;
  box-shadow: var(--shadow-sm);
  position: relative; overflow: hidden;
  transition: var(--transition);
  border: 1px solid var(--border);
}
.stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }

.stat-icon {
  width: 50px; height: 50px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.stat-card.teal .stat-icon   { background: #ccfbf1; color: var(--teal); }
.stat-card.green .stat-icon  { background: #dcfce7; color: var(--green); }
.stat-card.red .stat-icon    { background: #fee2e2; color: var(--red); }
.stat-card.orange .stat-icon { background: #ffedd5; color: var(--orange); }
.stat-card.indigo .stat-icon { background: #e0e7ff; color: var(--indigo); }
.stat-card.purple .stat-icon { background: #ede9fe; color: var(--purple); }

.stat-value {
  font-size: 28px; font-weight: 700;
  font-family: var(--font-heading);
  color: var(--text-primary);
  line-height: 1;
}
.stat-label { font-size: 12px; color: var(--text-muted); margin: 3px 0; }
.stat-trend { font-size: 11px; display: flex; align-items: center; gap: 3px; font-weight: 500; }
.stat-trend.up { color: var(--green); }
.stat-trend.down { color: var(--red); }

.stat-decor {
  position: absolute; right: -16px; top: -16px;
  width: 80px; height: 80px; border-radius: 50%;
  opacity: .07;
}
.stat-card.teal .stat-decor   { background: var(--teal); }
.stat-card.green .stat-decor  { background: var(--green); }
.stat-card.red .stat-decor    { background: var(--red); }
.stat-card.orange .stat-decor { background: var(--orange); }
.stat-card.indigo .stat-decor { background: var(--indigo); }
.stat-card.purple .stat-decor { background: var(--purple); }

/* ── CHARTS ── */
.charts-row {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}
.charts-row + .charts-row {
  grid-template-columns: 1fr 1fr;
}

.chart-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  transition: var(--transition);
}
.card-header-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.card-header-row h3 {
  font-size: 15px; font-weight: 600;
  font-family: var(--font-body);
  color: var(--text-primary);
}

.chart-period-btns { display: flex; gap: 4px; }
.period-btn {
  padding: 4px 10px; border-radius: 6px;
  font-size: 11px; font-weight: 600;
  border: 1px solid var(--border);
  background: var(--surface2); color: var(--text-muted);
  cursor: pointer; transition: var(--transition);
}
.period-btn.active { background: var(--blue); color: white; border-color: var(--blue); }

.donut-legend {
  display: flex; justify-content: center; gap: 20px;
  margin-top: 12px;
}
.leg-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); }
.leg-dot { width: 10px; height: 10px; border-radius: 50%; }
.leg-dot.green { background: var(--green); }
.leg-dot.red { background: var(--red); }

/* ── TABLES ── */
.tables-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}
.table-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}
.table-wrap { overflow-x: auto; }

.mini-table { width: 100%; border-collapse: collapse; }
.mini-table thead tr { border-bottom: 2px solid var(--border); }
.mini-table th {
  padding: 8px 10px; text-align: left;
  font-size: 11px; font-weight: 600;
  color: var(--text-muted); text-transform: uppercase; letter-spacing: .6px;
}
.mini-table td {
  padding: 10px 10px;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
  color: var(--text-primary);
}
.mini-table tbody tr:last-child td { border-bottom: none; }
.mini-table tbody tr:hover { background: var(--surface2); }

.student-cell { display: flex; align-items: center; gap: 9px; }
.s-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: white; flex-shrink: 0;
}
.s-avatar.blue   { background: var(--blue); }
.s-avatar.green  { background: var(--green); }
.s-avatar.orange { background: var(--orange); }
.s-avatar.purple { background: var(--purple); }
.s-avatar.red    { background: var(--red); }
.s-avatar.teal   { background: var(--teal); }
.s-avatar.indigo { background: var(--indigo); }

.student-cell b { display: block; font-size: 13px; font-weight: 600; color: var(--text-primary); }
.student-cell small { font-size: 11px; color: var(--text-muted); }

.mode-tag {
  background: var(--surface2); border: 1px solid var(--border);
  padding: 2px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 500; color: var(--text-secondary);
}
.view-all {
  font-size: 12px; color: var(--blue); font-weight: 600;
  display: flex; align-items: center; gap: 4px;
  transition: var(--transition);
}
.view-all:hover { gap: 7px; }

/* ── BADGES ── */
.badge-paid, .badge-partial, .badge-due,
.badge-present, .badge-absent {
  padding: 3px 9px; border-radius: 20px;
  font-size: 11px; font-weight: 600;
  display: inline-flex; align-items: center;
}
.badge-paid    { background: #dcfce7; color: #15803d; }
.badge-partial { background: #fff7ed; color: #c2410c; }
.badge-due     { background: #fee2e2; color: #b91c1c; }
.badge-present { background: #dcfce7; color: #15803d; }
.badge-absent  { background: #fee2e2; color: #b91c1c; }

/* ── ALERTS ── */
.alerts-section { margin-bottom: 24px; }
.section-header-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.section-header-row h3 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.section-header-row h3 i { color: var(--orange); }

.alert-cards-row {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px;
}
.alert-card {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: var(--radius-sm);
  border-left: 4px solid transparent;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
}
.alert-card:hover { transform: translateX(3px); }
.alert-card.red-alert    { border-color: var(--red); }
.alert-card.orange-alert { border-color: var(--orange); }
.alert-card.yellow-alert { border-color: var(--yellow); }

.alert-icon { font-size: 18px; flex-shrink: 0; }
.red-alert .alert-icon    { color: var(--red); }
.orange-alert .alert-icon { color: var(--orange); }
.yellow-alert .alert-icon { color: var(--yellow); }

.alert-body { flex: 1; }
.alert-body b { display: block; font-size: 13px; color: var(--text-primary); }
.alert-body p { font-size: 11px; color: var(--text-muted); margin: 2px 0 0; }

.alert-action {
  background: var(--surface2); border: 1px solid var(--border);
  padding: 5px 12px; border-radius: 6px;
  font-size: 12px; font-weight: 600; color: var(--blue);
  white-space: nowrap; transition: var(--transition);
}
.alert-action:hover { background: var(--blue); color: white; border-color: var(--blue); }

/* ── FOOTER ── */
.page-footer {
  text-align: center; padding: 16px;
  font-size: 12px; color: var(--text-muted);
  border-top: 1px solid var(--border);
}

/* ══════════════ STUDENTS PAGE ══════════════ */
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.page-header h1 {
  font-size: 22px; font-family: var(--font-heading);
  font-weight: 700; color: var(--text-primary);
}
.page-header p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

.btn-primary {
  background: var(--blue); color: white;
  padding: 10px 20px; border-radius: 9px;
  font-size: 13.5px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 7px;
  border: none; cursor: pointer; transition: var(--transition);
  box-shadow: 0 4px 12px rgba(37,99,235,.3);
}
.btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); }
.btn-secondary {
  background: var(--surface2); color: var(--text-secondary);
  padding: 10px 16px; border-radius: 9px;
  font-size: 13px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--border); cursor: pointer; transition: var(--transition);
}
.btn-secondary:hover { background: var(--border); color: var(--text-primary); }
.btn-danger {
  background: var(--red); color: white;
  padding: 8px 14px; border-radius: 7px;
  font-size: 12px; font-weight: 600;
  border: none; cursor: pointer; transition: var(--transition);
}

/* ── FILTER BAR ── */
.filter-bar {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 20px;
  display: flex; gap: 12px; align-items: center;
  margin-bottom: 20px; flex-wrap: wrap;
  box-shadow: var(--shadow-sm);
}
.search-box {
  flex: 1; min-width: 200px;
  position: relative;
}
.search-box i {
  position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted); font-size: 14px;
}
.search-box input {
  width: 100%; padding: 9px 12px 9px 36px;
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 13px; background: var(--surface2);
  color: var(--text-primary); outline: none;
  transition: var(--transition);
}
.search-box input:focus { border-color: var(--blue); background: var(--surface); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
.filter-select {
  padding: 9px 14px; border: 1px solid var(--border);
  border-radius: 8px; font-size: 13px;
  background: var(--surface2); color: var(--text-primary);
  outline: none; cursor: pointer; transition: var(--transition);
}
.filter-select:focus { border-color: var(--blue); }

/* ── DATA TABLE CARD ── */
.data-card {
  background: var(--surface); border-radius: var(--radius);
  border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.data-card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.data-card-header span { font-size: 13px; color: var(--text-muted); }
.full-table { width: 100%; border-collapse: collapse; }
.full-table thead { background: var(--surface2); }
.full-table th {
  padding: 11px 16px; text-align: left;
  font-size: 11.5px; font-weight: 600;
  color: var(--text-muted); text-transform: uppercase; letter-spacing: .7px;
  border-bottom: 1px solid var(--border);
}
.full-table td {
  padding: 13px 16px; font-size: 13px;
  border-bottom: 1px solid var(--border); color: var(--text-primary);
}
.full-table tbody tr:hover { background: var(--surface2); }
.full-table tbody tr:last-child td { border-bottom: none; }

.action-btns { display: flex; gap: 6px; }
.btn-icon {
  width: 30px; height: 30px; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; cursor: pointer; border: 1px solid var(--border);
  background: var(--surface2); color: var(--text-secondary);
  transition: var(--transition);
}
.btn-icon.view:hover   { background: var(--blue); color: white; border-color: var(--blue); }
.btn-icon.edit:hover   { background: var(--orange); color: white; border-color: var(--orange); }
.btn-icon.delete:hover { background: var(--red); color: white; border-color: var(--red); }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(0,0,0,.5);
  display: none; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
  padding: 20px;
}
.modal-overlay.show { display: flex; animation: fadeIn .2s ease; }
.modal-box {
  background: var(--surface);
  border-radius: var(--radius-lg);
  width: 100%; max-width: 780px;
  max-height: 90vh; overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: slideUp .25s cubic-bezier(.4,0,.2,1);
}
.modal-header {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: var(--surface);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}
.modal-title {
  font-size: 18px; font-weight: 700;
  font-family: var(--font-heading);
  display: flex; align-items: center; gap: 10px;
}
.modal-title i { color: var(--blue); }
.modal-close {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--surface2); border: none;
  cursor: pointer; color: var(--text-muted); font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.modal-close:hover { background: var(--red); color: white; }
.modal-body { padding: 20px 24px; }
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex; gap: 10px; justify-content: flex-end;
}

/* ── FORM SECTIONS ── */
.form-section { margin-bottom: 24px; }
.form-section-title {
  font-size: 12px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; color: var(--text-muted);
  margin-bottom: 14px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.form-section-title i { color: var(--blue); font-size: 13px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-row-3 { grid-template-columns: 1fr 1fr 1fr; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.form-group input, .form-group select, .form-group textarea {
  padding: 9px 12px; border: 1px solid var(--border);
  border-radius: 8px; font-size: 13px;
  background: var(--surface2); color: var(--text-primary);
  outline: none; font-family: var(--font-body);
  transition: var(--transition);
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--blue); background: var(--surface);
  box-shadow: 0 0 0 3px rgba(37,99,235,.12);
}
.form-group textarea { resize: vertical; min-height: 80px; }
.required { color: var(--red); margin-left: 2px; }

/* ── ATTENDANCE PAGE ── */
.attendance-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 14px; margin-bottom: 24px;
}
.att-date-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}
.att-date-card .att-number { font-size: 32px; font-family: var(--font-heading); font-weight: 700; }
.att-date-card .att-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

.attendance-mark-card {
  background: var(--surface); border-radius: var(--radius);
  border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  margin-bottom: 24px;
}
.att-student-row {
  display: flex; align-items: center; padding: 12px 20px;
  border-bottom: 1px solid var(--border); gap: 14px;
}
.att-student-row:last-child { border-bottom: none; }
.att-student-row:hover { background: var(--surface2); }
.att-student-info { flex: 1; }
.att-student-info b { display: block; font-size: 13px; }
.att-student-info small { font-size: 11px; color: var(--text-muted); }
.att-actions { display: flex; gap: 8px; }
.att-btn {
  padding: 6px 14px; border-radius: 6px;
  font-size: 12px; font-weight: 600; border: none;
  cursor: pointer; transition: var(--transition);
}
.att-btn.present { background: #dcfce7; color: var(--green); }
.att-btn.present.active, .att-btn.present:hover { background: var(--green); color: white; }
.att-btn.absent { background: #fee2e2; color: var(--red); }
.att-btn.absent.active, .att-btn.absent:hover { background: var(--red); color: white; }

/* ── FEE MANAGEMENT ── */
.fee-cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px; margin-bottom: 24px;
}
.fee-stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow-sm); display: flex;
  align-items: center; gap: 14px;
  transition: var(--transition);
}
.fee-stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.fee-stat-icon {
  width: 46px; height: 46px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}

/* ── RECEIPT CARD ── */
.receipt-paper {
  background: white; border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  max-width: 600px; margin: 0 auto;
  overflow: hidden; border: 1px solid #e5e7eb;
}
.receipt-header-strip {
  background: linear-gradient(135deg, #1d4ed8, #7c3aed);
  padding: 28px 32px; color: white; text-align: center;
}
.receipt-logo-area { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 6px; }
.receipt-logo { width: 48px; height: 48px; background: rgba(255,255,255,.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.receipt-centre-name { font-family: var(--font-heading); font-size: 22px; font-weight: 700; }
.receipt-sub { font-size: 12px; opacity: .8; margin-top: 2px; }
.receipt-receipt-no {
  background: rgba(255,255,255,.15); padding: 4px 16px;
  border-radius: 20px; font-size: 12px; font-weight: 700;
  letter-spacing: 1px; display: inline-block; margin-top: 8px;
}
.receipt-body { padding: 24px 32px; }
.receipt-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #e5e7eb; }
.receipt-row:last-child { border: none; }
.receipt-row .r-label { font-size: 12px; color: #6b7280; font-weight: 500; }
.receipt-row .r-value { font-size: 13px; color: #111827; font-weight: 600; }
.receipt-amount-box {
  background: linear-gradient(135deg, #dcfce7, #bbf7d0);
  border: 2px solid #16a34a; border-radius: 12px;
  padding: 16px; text-align: center; margin: 16px 0;
}
.receipt-amount-box .r-amount { font-size: 32px; font-family: var(--font-heading); font-weight: 700; color: var(--green); }
.receipt-amount-box .r-words { font-size: 12px; color: #15803d; margin-top: 3px; }
.receipt-footer-strip {
  background: var(--surface2); padding: 16px 32px;
  display: flex; justify-content: space-between; align-items: center;
  border-top: 1px solid var(--border);
}
.receipt-footer-strip .sig-area { text-align: center; }
.receipt-footer-strip .sig-line { width: 120px; border-bottom: 2px solid var(--text-muted); margin-bottom: 4px; }
.receipt-footer-strip .sig-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }

/* ── SETTINGS PAGE ── */
.settings-grid { display: grid; grid-template-columns: 240px 1fr; gap: 20px; }
.settings-sidebar {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px;
  box-shadow: var(--shadow-sm); height: fit-content;
}
.settings-tab {
  padding: 10px 14px; border-radius: 8px;
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; cursor: pointer; transition: var(--transition);
  color: var(--text-secondary); margin-bottom: 2px;
}
.settings-tab:hover { background: var(--surface2); }
.settings-tab.active { background: #eff6ff; color: var(--blue); font-weight: 600; }
.settings-tab i { width: 16px; }

.settings-panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px;
  box-shadow: var(--shadow-sm);
}
.settings-panel h2 {
  font-size: 18px; font-family: var(--font-heading);
  margin-bottom: 6px;
}
.settings-panel .settings-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }

/* ── LOGIN PAGE ── */
.login-page {
  min-height: 100vh;
  background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; position: relative; overflow: hidden;
  margin-left: 0 !important;
}
.login-bg-shapes .shape {
  position: absolute; border-radius: 50%; opacity: .05;
}
.login-card {
  background: rgba(255,255,255,.04);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 20px; padding: 40px;
  width: 100%; max-width: 420px;
  box-shadow: 0 24px 64px rgba(0,0,0,.4);
}
.login-logo {
  text-align: center; margin-bottom: 28px;
}
.login-logo .logo-icon {
  width: 64px; height: 64px;
  background: linear-gradient(135deg, #1d4ed8, #7c3aed);
  border-radius: 16px; margin: 0 auto 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; color: white;
  box-shadow: 0 8px 24px rgba(29,78,216,.4);
}
.login-logo h1 { font-family: var(--font-heading); font-size: 22px; color: white; }
.login-logo p { font-size: 12px; color: rgba(255,255,255,.5); margin-top: 3px; }
.login-form .form-group label { color: rgba(255,255,255,.7); }
.login-form .form-group input {
  background: rgba(255,255,255,.08);
  border-color: rgba(255,255,255,.15); color: white;
}
.login-form .form-group input:focus {
  border-color: var(--blue); background: rgba(255,255,255,.12);
}
.login-form .form-group input::placeholder { color: rgba(255,255,255,.3); }
.btn-login {
  width: 100%; padding: 12px; border-radius: 10px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  color: white; font-size: 15px; font-weight: 600;
  border: none; cursor: pointer; transition: var(--transition);
  margin-top: 8px; box-shadow: 0 4px 16px rgba(29,78,216,.4);
}
.btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(29,78,216,.5); }
.login-footer { text-align: center; margin-top: 20px; font-size: 12px; color: rgba(255,255,255,.4); }

/* ── PROFILE PAGE ── */
.profile-header-card {
  background: linear-gradient(135deg, #1d4ed8, #7c3aed);
  border-radius: var(--radius-lg); padding: 28px;
  color: white; display: flex; gap: 24px; align-items: center;
  margin-bottom: 20px;
}
.profile-photo {
  width: 80px; height: 80px; border-radius: 50%;
  background: rgba(255,255,255,.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; font-weight: 700;
  border: 3px solid rgba(255,255,255,.4); flex-shrink: 0;
}
.profile-meta h2 { font-family: var(--font-heading); font-size: 22px; }
.profile-meta p  { opacity: .8; font-size: 13px; margin-top: 3px; }
.profile-tags { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.profile-tag {
  background: rgba(255,255,255,.15); padding: 3px 12px;
  border-radius: 20px; font-size: 12px; font-weight: 500;
}
.profile-tabs {
  display: flex; gap: 4px; margin-bottom: 16px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 4px;
  width: fit-content;
}
.profile-tab {
  padding: 7px 16px; border-radius: 6px;
  font-size: 13px; cursor: pointer; transition: var(--transition);
  color: var(--text-muted); font-weight: 500;
}
.profile-tab.active { background: var(--blue); color: white; }

/* ── RESPONSIVE ── */
@media (max-width: 1100px) {
  .charts-row { grid-template-columns: 1fr; }
  .charts-row + .charts-row { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 900px) {
  .tables-row { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr 1fr; }
  .form-row-3 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 768px) {
  :root { --sidebar-w: 0px; }
  .sidebar { transform: translateX(-260px); width: 260px; }
  .sidebar.open { transform: translateX(0); --sidebar-w: 260px; }
  .main-wrapper { margin-left: 0; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .welcome-actions { display: none; }
  .settings-grid { grid-template-columns: 1fr; }
  .charts-row + .charts-row { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  .stats-grid { grid-template-columns: 1fr; }
  .alert-cards-row { grid-template-columns: 1fr; }
  .form-row, .form-row-3 { grid-template-columns: 1fr; }
  .page-content { padding: 14px; }
}

/* ── ANIMATIONS ── */
@keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes countUp { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: scale(1); } }

.stat-card { animation: slideUp .4s cubic-bezier(.4,0,.2,1) both; }
.stat-card:nth-child(1) { animation-delay: .05s; }
.stat-card:nth-child(2) { animation-delay: .10s; }
.stat-card:nth-child(3) { animation-delay: .15s; }
.stat-card:nth-child(4) { animation-delay: .20s; }
.stat-card:nth-child(5) { animation-delay: .25s; }
.stat-card:nth-child(6) { animation-delay: .30s; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ── UTILITY ── */
.mt-0 { margin-top: 0 !important; }
.mb-16 { margin-bottom: 16px; }
.mb-24 { margin-bottom: 24px; }
.text-center { text-align: center; }
.d-flex { display: flex; }
.align-center { align-items: center; }
.gap-10 { gap: 10px; }
.gap-12 { gap: 12px; }
.w-100 { width: 100%; }
.hidden { display: none !important; }

/* ── DARK MODE OVERRIDES ── */
[data-theme="dark"] .receipt-paper { background: var(--surface); }
[data-theme="dark"] .receipt-row .r-label { color: var(--text-secondary); }
[data-theme="dark"] .receipt-row .r-value { color: var(--text-primary); }
[data-theme="dark"] .mini-table tbody tr:hover td { color: var(--text-primary); }
[data-theme="dark"] .att-btn.present { background: rgba(22,163,74,.15); }
[data-theme="dark"] .att-btn.absent  { background: rgba(220,38,38,.15); }
[data-theme="dark"] .badge-paid    { background: rgba(22,163,74,.15); color: #4ade80; }
[data-theme="dark"] .badge-partial { background: rgba(234,88,12,.15); color: #fb923c; }
[data-theme="dark"] .badge-due     { background: rgba(220,38,38,.15); color: #f87171; }
[data-theme="dark"] .badge-present { background: rgba(22,163,74,.15); color: #4ade80; }
[data-theme="dark"] .badge-absent  { background: rgba(220,38,38,.15); color: #f87171; }

/* ── PRINT STYLES ── */
@media print {
  .sidebar, .topnav, .page-footer, .btn-primary, .btn-secondary, .btn-danger { display: none !important; }
  .main-wrapper { margin-left: 0; }
  .receipt-paper { box-shadow: none; border: 1px solid #ddd; max-width: 100%; }
}

/* Chart wrapper forces fixed height so charts never grow beyond it */
.chart-wrapper { position:relative; height:220px; width:100%; }
.chart-wrapper-sm { position:relative; height:200px; width:100%; }
/* Dashboard layout rows */
.dash-row-1 { display:grid; grid-template-columns:2fr 1fr; gap:16px; margin-bottom:20px; }
.dash-row-2 { display:grid; grid-template-columns:1fr 1fr;  gap:16px; margin-bottom:20px; }
@media(max-width:900px){ .dash-row-1,.dash-row-2{ grid-template-columns:1fr; } }

/* ════════════════════════════════════════════════════════
   AUTH — session management + route guard
   ════════════════════════════════════════════════════════ */
const AUTH = {
  SESSION_KEY: 'ssTmsSession',

  /** Single admin account; staff added via StaffManager */
  _adminUser: { username:'ssadmin', password:'Sharada@2026', role:'admin', name:'Admin' },

  /** Returns session object or null */
  currentUser() {
    try {
      const raw = sessionStorage.getItem(this.SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  },

  /** Attempt login — checks admin then staff accounts */
  login(username, password) {
    // Admin
    const adm = this._adminUser;
    if (username === adm.username && password === adm.password) {
      return { username, role:'admin', name: adm.name };
    }
    // Staff
    const staff = StaffManager.getAll();
    const found = staff.find(s => s.username === username && s.password === password);
    if (found) return { username, role:'staff', name: found.name };
    return null;
  },

  /** Save session and go to dashboard */
  startSession(user) {
    sessionStorage.setItem(this.SESSION_KEY, JSON.stringify(user));
  },

  /** Clear session and redirect to login */
  logout() {
    sessionStorage.removeItem(this.SESSION_KEY);
    window.location.replace('login.html');
  },

  /**
   * Call at top of every protected page.
   * Immediately redirects to login if no valid session.
   */
  requireAuth() {
    const user = this.currentUser();
    if (!user) {
      window.location.replace('login.html');
      return false;
    }
    // Populate user pill
    const nameEl = document.querySelector('.user-name');
    const roleEl = document.querySelector('.user-role');
    const avatarEl = document.querySelector('.user-avatar');
    if (nameEl)   nameEl.textContent   = user.name;
    if (roleEl)   roleEl.textContent   = user.role.charAt(0).toUpperCase() + user.role.slice(1);
    if (avatarEl) avatarEl.textContent = user.name.charAt(0).toUpperCase();
    return true;
  }
};

/* ════════════════════════════════════════════════════════
   THEME — dark/light with localStorage persistence
   ════════════════════════════════════════════════════════ */
const ThemeManager = {
  STORAGE_KEY: 'ssTmsTheme',
  init() {
    this.apply(localStorage.getItem(this.STORAGE_KEY) || 'light');
    document.getElementById('themeToggle')
      ?.addEventListener('click', () => this.toggle());
  },
  apply(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem(this.STORAGE_KEY, theme);
    const icon = document.getElementById('themeIcon');
    if (icon) icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
  },
  toggle() {
    this.apply(
      document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
    );
  }
};

/* ════════════════════════════════════════════════════════
   SIDEBAR
   ════════════════════════════════════════════════════════ */
const SidebarManager = {
  init() {
    const btn     = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('sidebar');
    const wrapper = document.getElementById('mainWrapper');
    if (!btn || !sidebar) return;

    btn.addEventListener('click', () => {
      if (window.innerWidth <= 768) {
        sidebar.classList.toggle('open');
      } else {
        sidebar.classList.toggle('collapsed');
        if (wrapper) {
          wrapper.style.marginLeft = sidebar.classList.contains('collapsed') ? '0' : '260px';
        }
      }
    });
    // Close on outside tap (mobile)
    document.addEventListener('click', e => {
      if (window.innerWidth <= 768
          && sidebar.classList.contains('open')
          && !sidebar.contains(e.target)
          && !btn.contains(e.target)) {
        sidebar.classList.remove('open');
      }
    });
  }
};

/* ════════════════════════════════════════════════════════

const ToastManager = {
  _el: null,
  _ensure() {
    if (this._el) return;
    this._el = Object.assign(document.createElement('div'), {
      style: 'position:fixed;bottom:24px;right:24px;z-index:99999;display:flex;flex-direction:column;gap:8px;pointer-events:none'
    });
    document.body.appendChild(this._el);
  },
  show(msg, type = 'success') {
    this._ensure();
    const map = {
      success:{ bg:'#dcfce7', bd:'#16a34a', fg:'#15803d', ic:'fa-check-circle' },
      error:  { bg:'#fee2e2', bd:'#dc2626', fg:'#b91c1c', ic:'fa-times-circle' },
      warning:{ bg:'#fff7ed', bd:'#ea580c', fg:'#c2410c', ic:'fa-exclamation-circle' },
      info:   { bg:'#eff6ff', bd:'#2563eb', fg:'#1d4ed8', ic:'fa-info-circle' }
    };
    const c = map[type] || map.info;
    const t = Object.assign(document.createElement('div'), {
      innerHTML: `<i class="fas ${c.ic}"></i> ${msg}`,
      style: `background:${c.bg};border:1px solid ${c.bd};color:${c.fg};
              padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;
              display:flex;align-items:center;gap:8px;pointer-events:auto;
              box-shadow:0 4px 16px rgba(0,0,0,.15);max-width:320px;
              font-family:'DM Sans',system-ui,sans-serif;transition:all .3s ease;`
    });
    this._el.appendChild(t);
    setTimeout(() => {
      t.style.opacity = '0';
      t.style.transform = 'translateY(8px)';
      setTimeout(() => t.remove(), 300);
    }, 3500);
  }
};

const ModalManager = {
  init() {
    document.querySelectorAll('.modal-overlay').forEach(o => {
      o.addEventListener('click', e => { if (e.target === o) o.classList.remove('show'); });
    });
    document.querySelectorAll('.modal-close').forEach(b => {
      b.addEventListener('click', () => b.closest('.modal-overlay')?.classList.remove('show'));
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape')
        document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show'));

  open(id)  { document.getElementById(id)?.classList.add('show'); },

/* ════════════════════════════════════════════════════════
   COUNTER ANIMATION
   ════════════════════════════════════════════════════════ */
const CounterAnimation = {
  init() {
    document.querySelectorAll('.stat-value[data-target]').forEach(el => {
      const target = parseInt(el.getAttribute('data-target'), 10);
      const isCurrency = el.classList.contains('currency');
      const dur = 1200, start = performance.now();
      const tick = now => {
        const p = Math.min((now - start) / dur, 1);
        const ease = 1 - Math.pow(1 - p, 3);
        const val  = Math.floor(ease * target);
        el.textContent = isCurrency
          ? '\u20B9' + val.toLocaleString('en-IN')
          : val.toLocaleString('en-IN');
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }
};

   ════════════════════════════════════════════════════════ */
const StaffManager = {
  KEY: 'ssTmsStaff',
  getAll()   { try { return JSON.parse(localStorage.getItem(this.KEY) || '[]'); } catch { return []; } },
  _save(arr) { localStorage.setItem(this.KEY, JSON.stringify(arr)); },

  add(name, username, password, mobile) {
    const list = this.getAll();
    if (list.find(s => s.username === username)) return false;   // duplicate
    list.push({ id: Date.now(), name, username, password, mobile,
                role:'staff', status:'Active', created: new Date().toISOString() });
    this._save(list);
    return true;
  },

  remove(id) {
    this._save(this.getAll().filter(s => s.id !== id));
  },

  /** Render into #staffTbody — call after every mutation */
  render() {
    const tbody = document.getElementById('staffTbody');
    if (!tbody) return;
    const list = this.getAll();
    if (!list.length) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text-muted)">

        </div></td>
      </tr>`).join('');
  }
};

/* ════════════════════════════════════════════════════════

   ════════════════════════════════════════════════════════ */
const SettingsManager = {
  KEY: 'ssTmsSettings',

  get()     { try { return JSON.parse(localStorage.getItem(this.KEY) || '{}'); } catch { return {}; } },
  set(data) { localStorage.setItem(this.KEY, JSON.stringify({ ...this.get(), ...data })); },

  _gv(id)   { const el = document.getElementById(id); return el ? el.value.trim() : null; },
  _sv(id, val) {
    const el = document.getElementById(id);
    if (el && val !== null && val !== undefined) {
      if (el.tagName === 'TEXTAREA') el.value = val;
      else el.value = val;
    }
  },

  /** Load all saved settings into form fields */
  load() {
    const s = this.get();
    const fields = [
      'centreName','regNumber','centrePhone','centreEmail','centreAddr',
      'adminDisplayName','adminLoginUsername','adminEmail','adminPhone',
      'feeDueDate','lateFee','rcPrefix','rcStart',
      'feeC1','feeC2','feeC3','feeC4','feeC5','feeC6','feeC7'
    ];
    fields.forEach(id => { if (s[id] !== undefined) this._sv(id, s[id]); });
  },

  saveCentre() {
    const data = {};
    ['centreName','regNumber','centrePhone','centreEmail','centreAddr'].forEach(id => {
      const v = this._gv(id); if (v !== null) data[id] = v;
    });
    this.set(data);
    ToastManager.show('Centre information saved!', 'success');
  },

  saveProfile() {
    const data = {};
    ['adminDisplayName','adminLoginUsername','adminEmail','adminPhone'].forEach(id => {
      const v = this._gv(id); if (v !== null) data[id] = v;
    });
    // Password change
    const np = this._gv('newPass');
    const cp = this._gv('confPass');
    if (np) {
      if (np.length < 6) { ToastManager.show('Password must be at least 6 characters.', 'warning'); return; }
      if (np !== cp)     { ToastManager.show('Passwords do not match.', 'error'); return; }
      data.adminPass = np;
      ['currPass','newPass','confPass'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
      ToastManager.show('Password changed! Please remember your new credentials.', 'info');
    }
    this.set(data);
    ToastManager.show('Profile saved successfully!', 'success');
  },

  saveFees() {
    const data = {};
    ['feeDueDate','lateFee','rcPrefix','rcStart',
     'feeC1','feeC2','feeC3','feeC4','feeC5','feeC6','feeC7'].forEach(id => {
      const v = this._gv(id); if (v !== null) data[id] = v;
    });
    this.set(data);
    ToastManager.show('Fee settings saved!', 'success');
  },

  exportBackup() {
    const blob = new Blob([JSON.stringify({
      students:   JSON.parse(localStorage.getItem('ssTmsStudents')  || '[]'),
      attendance: JSON.parse(localStorage.getItem('ssTmsAttendance')|| '{}'),
      fees:       JSON.parse(localStorage.getItem('ssTmsFees')      || '[]'),
      staff:      JSON.parse(localStorage.getItem('ssTmsStaff')     || '[]'),
      settings:   this.get(),
      exportDate: new Date().toISOString()
    }, null, 2)], { type:'application/json' });
    const a = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(blob),
      download: `ShreeSharada-Backup-${new Date().toISOString().split('T')[0]}.json`
    });
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(a.href);
    ToastManager.show('Backup downloaded!', 'success');
  }
};

  _color(id)  { return this._COLORS[id.charCodeAt(id.length-1) % this._COLORS.length]; },
  _initials(n){ return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); },

  _render(list = null) {
    const tbody = document.getElementById('studentTbody');
    if (!tbody) return;
    const data = list ?? this.getAll();
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-muted)">
        <i class="fas fa-search" style="font-size:28px;display:block;margin-bottom:10px;opacity:.4"></i>No students found</td></tr>`;
      return;
    }
    tbody.innerHTML = data.map(s => `
      <tr>
        <td><div class="student-cell">
          <div class="s-avatar ${this._color(s.id)}">${this._initials(s.name)}</div>
          <div><b>${s.name}</b><small>${s.id}</small></div>
        </div></td>
        <td>${s.grade}</td>
        <td>${s.parentName}</td>
        <td>${s.mobile}</td>
        <td>\u20B9${s.fee.toLocaleString('en-IN')}/mo</td>
        <td>${s.status === 'Active' ? '<span class="badge-paid">Active</span>' : '<span class="badge-due">Inactive</span>'}</td>
        <td>${new Date(s.admDate).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</td>
        <td><div class="action-btns">
          <button class="btn-icon edit" onclick="StudentManager.openModal('${s.id}')" title="Edit"><i class="fas fa-edit"></i></button>
          <button class="btn-icon delete" onclick="StudentManager.delete('${s.id}')" title="Delete"><i class="fas fa-trash"></i></button>
        </div></td>
      </tr>`).join('');
  },

  _bindSearch() {
    ['searchStudent','filterGrade','filterStatus'].forEach(id => {
      document.getElementById(id)?.addEventListener('input',  () => this._applyFilters());
      document.getElementById(id)?.addEventListener('change', () => this._applyFilters());
    });
  },

  _applyFilters() {
    const q = (document.getElementById('searchStudent')?.value || '').toLowerCase();
    const g = document.getElementById('filterGrade')?.value  || '';
    const s = document.getElementById('filterStatus')?.value || '';
    this._render(this.getAll().filter(x =>
      (!q || x.name.toLowerCase().includes(q) || x.id.includes(q) || x.mobile.includes(q) || x.parentName.toLowerCase().includes(q)) &&
      (!g || x.grade === g) &&
      (!s || x.status === s)
    ));
  },

  _nextId() {
    const nums = this.getAll().map(s => parseInt(s.id.split('-')[2], 10) || 0);
    return 'SSC-2026-' + String(Math.max(0, ...nums) + 1).padStart(3, '0');
  },

  openModal(id = null) {
    const overlay = document.getElementById('studentModal');
    if (!overlay) return;
    this._editId = id;
    const title = overlay.querySelector('.modal-title span') || overlay.querySelector('h2');
    if (title) title.textContent = id ? 'Edit Student' : 'Add New Student';
    if (id) {
      const s = this.getAll().find(x => x.id === id);
      if (s) {
        const set = (el, v) => { const e = document.getElementById(el); if (e) e.value = v ?? ''; };
        set('studentId', s.id); set('studentName', s.name); set('studentDob', s.dob);
        set('studentGender', s.gender); set('studentGrade', s.grade); set('bloodGroup', s.blood);
        set('parentName', s.parentName); set('parentMobile', s.mobile); set('studentEmail', s.email);
        set('studentCity', s.city); set('monthlyFee', s.fee); set('studentStatus', s.status);
        set('admissionDate', s.admDate);
      }
    } else {
      document.getElementById('studentForm')?.reset();
      const idEl = document.getElementById('studentId'); if (idEl) idEl.value = this._nextId();
    }
    overlay.classList.add('show');
  },

  closeModal() {
    document.getElementById('studentModal')?.classList.remove('show');
    this._editId = null;
  },

  save() {
    const gv = id => document.getElementById(id)?.value?.trim() || '';
    const s = {
      id: gv('studentId'), name: gv('studentName'), dob: gv('studentDob'),
      gender: gv('studentGender'), grade: gv('studentGrade'), blood: gv('bloodGroup'),
      parentName: gv('parentName'), mobile: gv('parentMobile'), email: gv('studentEmail'),
      city: gv('studentCity'), fee: parseInt(gv('monthlyFee'), 10) || 0,
      status: gv('studentStatus'), admDate: gv('admissionDate')
    };
    if (!s.name || !s.grade || !s.mobile) {
      ToastManager.show('Name, Grade and Mobile are required.', 'warning'); return;
    }
    const list = this.getAll();
    if (this._editId) {
      const i = list.findIndex(x => x.id === this._editId);
      if (i > -1) list[i] = s;
      ToastManager.show('Student updated!', 'success');
    } else {
      list.push(s);
      ToastManager.show('Student added!', 'success');
    }
    this._save(list);
    this._render();
    this.closeModal();
  },

  delete(id) {
    const s = this.getAll().find(x => x.id === id);
    if (!s || !confirm(`Delete ${s.name}? This cannot be undone.`)) return;
    this._save(this.getAll().filter(x => x.id !== id));
    this._render();
    ToastManager.show('Student deleted.', 'error');
  }
};

    {id:'PAY-008',studentId:'SSC-2026-008',name:'Neha Rao',      grade:'Class 3',month:'May 2026',totalFee:1000,paid:1000,due:0,   date:'2026-05-06',mode:'Cash', status:'Paid'}
  ],
  getAll()   { try { return JSON.parse(localStorage.getItem(this.KEY)) || this.samplePayments; } catch { return this.samplePayments; } },
  _save(arr) { localStorage.setItem(this.KEY, JSON.stringify(arr)); },

  init() { this._render(); this._updateStats(); },

  _render(list = null) {
    const tbody = document.getElementById('feeTbody');
    if (!tbody) return;
    (list ?? this.getAll()).forEach(p => {
      const badge = p.status === 'Paid' ? '<span class="badge-paid">Paid</span>'
                  : p.status === 'Partially Paid' ? '<span class="badge-partial">Partial</span>'
                  : '<span class="badge-due">Due</span>';
      tbody.insertAdjacentHTML('beforeend', `
        <tr>
          <td><b>${p.name}</b><small style="display:block;color:var(--text-muted)">${p.studentId}</small></td>
          <td>${p.grade}</td><td>${p.month}</td>
          <td>\u20B9${p.totalFee.toLocaleString('en-IN')}</td>
          <td style="color:var(--green);font-weight:600">\u20B9${p.paid.toLocaleString('en-IN')}</td>
          <td style="color:${p.due>0?'var(--red)':'var(--green)'};font-weight:600">\u20B9${p.due.toLocaleString('en-IN')}</td>
          <td>${p.date||'—'}</td>
          <td><span class="mode-tag">${p.mode}</span></td>
          <td>${badge}</td>
          <td><div class="action-btns">
            ${p.due > 0 ? `<button class="btn-primary" style="padding:5px 12px;font-size:12px" onclick="FeeManager.collect('${p.id}')">Collect</button>` : ''}
            <button class="btn-icon view" onclick="ReceiptManager.generate('${p.id}')" title="Receipt"><i class="fas fa-receipt"></i></button>
          </div></td>
        </tr>`);
    });
  },

  _updateStats() {
    const fees = this.getAll();
    const tot  = fees.reduce((a,p) => a+p.paid, 0);
    const due  = fees.reduce((a,p) => a+p.due,  0);
    const dc   = fees.filter(p => p.status !== 'Paid').length;
    const set  = (id,v) => { const e=document.getElementById(id); if(e) e.textContent=v; };
    set('totalCollected', '\u20B9' + tot.toLocaleString('en-IN'));
    set('totalDue',       '\u20B9' + due.toLocaleString('en-IN'));
    set('dueCount',       dc);
  },

  collect(id) {
    const fees = this.getAll();
    const p = fees.find(x => x.id === id);
    if (!p) return;
    const amt = prompt(`Collect fee for ${p.name}\nDue: \u20B9${p.due}\nEnter amount:`);
    if (!amt || isNaN(amt) || +amt <= 0) return;
    const col = Math.min(Math.round(+amt), p.due);
    p.paid += col; p.due -= col;
    p.date = new Date().toISOString().split('T')[0]; p.mode = 'Cash';
    p.status = p.due === 0 ? 'Paid' : 'Partially Paid';
    this._save(fees);
    document.getElementById('feeTbody').innerHTML = '';
    this._render(); this._updateStats();
    ToastManager.show(`\u20B9${col.toLocaleString('en-IN')} collected!`, 'success');
  }
};

/* ════════════════════════════════════════════════════════
   ATTENDANCE MANAGER
   ════════════════════════════════════════════════════════ */
const AttendanceManager = {
  KEY: 'ssTmsAttendance',
  today: new Date().toISOString().split('T')[0],

  _rec()     { try { return JSON.parse(localStorage.getItem(this.KEY)||'{}'); } catch { return {}; } },
  _save(r)   { localStorage.setItem(this.KEY, JSON.stringify(r)); },
  _key(sid)  { return `${this.today}_${sid}`; },

  mark(sid, status) {
    const rec = this._rec();
    rec[this._key(sid)] = { studentId:sid, date:this.today, status,
      time: status==='Present' ? new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}) : '' };
    this._save(rec); this._updateBtn(sid, status); this._stats();
  },

  status(sid) { return this._rec()[this._key(sid)]?.status || 'Not Marked'; },

  _updateBtn(sid, status) {
    const row = document.querySelector(`[data-student-id="${sid}"]`);
    if (!row) return;
    row.querySelectorAll('.att-btn').forEach(b => b.classList.remove('active'));
    row.querySelector(`.att-btn.${status.toLowerCase()}`)?.classList.add('active');
    const se = row.querySelector('.att-status');
    if (se) { se.textContent = status; se.className = `att-status ${status==='Present'?'badge-present':'badge-absent'}`; se.style.display = ''; }
  },

  _stats() {
    const students = StudentManager.getAll().filter(s => s.status==='Active');
    const rec      = this._rec();
    const todayRec = Object.values(rec).filter(r => r.date===this.today);
    const present  = todayRec.filter(r => r.status==='Present').length;
    const absent   = todayRec.filter(r => r.status==='Absent').length;
    const pct      = students.length ? Math.round(present/students.length*100) : 0;
    const set      = (id,v) => { const e=document.getElementById(id); if(e) e.textContent=v; };
    set('attPresent', present); set('attAbsent', absent);
    set('attPct', pct+'%'); set('attNotMarked', Math.max(0, students.length - todayRec.length));
  },

  init() {
    this.renderList();
    this._stats();
    document.getElementById('attClassFilter')?.addEventListener('change', () => this.renderList());
  },

  renderList() {
    const container = document.getElementById('attendanceList');
    if (!container) return;
    const cf       = document.getElementById('attClassFilter')?.value || '';
    const students = StudentManager.getAll().filter(s => s.status==='Active' && (!cf||s.grade===cf));
    const COLORS   = ['blue','green','orange','purple','red','teal','indigo'];
    container.innerHTML = students.map(s => {
      const cur   = this.status(s.id);
      const color = COLORS[s.id.charCodeAt(s.id.length-1)%COLORS.length];
      return `
        <div class="att-student-row" data-student-id="${s.id}">
          <div class="s-avatar ${color}">${s.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}</div>
          <div class="att-student-info"><b>${s.name}</b><small>${s.grade} · ${s.id}</small></div>
          <span class="att-status ${cur==='Present'?'badge-present':cur==='Absent'?'badge-absent':''}"
                style="${cur==='Not Marked'?'display:none':''}">${cur!=='Not Marked'?cur:''}</span>
          <div class="att-actions">
            <button class="att-btn present ${cur==='Present'?'active':''}"
              onclick="AttendanceManager.mark('${s.id}','Present')"><i class="fas fa-check"></i> Present</button>
            <button class="att-btn absent  ${cur==='Absent'?'active':''}"
              onclick="AttendanceManager.mark('${s.id}','Absent')"><i class="fas fa-times"></i> Absent</button>
          </div>
        </div>`;
    }).join('');
  }
};

/* ════════════════════════════════════════════════════════
   EXCEL / CSV EXPORTER (real file download)
   ════════════════════════════════════════════════════════ */
const ExcelExporter = {
  _csv(rows) {
    return rows.map(r => r.map(c => `"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  },
  _download(csv, name) {
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
    const a    = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: name });
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(a.href);
    ToastManager.show(`${name} downloaded!`, 'success');
  },
  students() {
    const rows = [['Student ID','Name','Grade','Parent','Mobile','Fee/Month','Status','Admission','City','Blood']];
    StudentManager.getAll().forEach(s => rows.push([s.id,s.name,s.grade,s.parentName,s.mobile,s.fee,s.status,s.admDate,s.city,s.blood]));
    this._download(this._csv(rows), `Students_${new Date().toISOString().split('T')[0]}.csv`);
  },
  fees() {
    const rows = [['ID','Student','Grade','Month','Total','Paid','Due','Date','Mode','Status']];
    FeeManager.getAll().forEach(p => rows.push([p.id,p.name,p.grade,p.month,p.totalFee,p.paid,p.due,p.date,p.mode,p.status]));
    this._download(this._csv(rows), `Fees_${new Date().toISOString().split('T')[0]}.csv`);
  },
  attendance() {
    const rows = [['Student ID','Name','Grade','Present','Absent','Total','%']];
    StudentManager.getAll().forEach(s => {
      const p=20+Math.floor(Math.random()*6), t=26;
      rows.push([s.id,s.name,s.grade,p,t-p,t,Math.round(p/t*100)+'%']);
    });
    this._download(this._csv(rows), `Attendance_${new Date().toISOString().split('T')[0]}.csv`);
  }
};

/* ════════════════════════════════════════════════════════
   IST GREETING
   ════════════════════════════════════════════════════════ */
function getISTGreeting() {
  const now  = new Date();
  const ist  = new Date(now.getTime() + now.getTimezoneOffset()*60000 + 5.5*3600000);
  const h    = ist.getHours();
  const user = AUTH.currentUser();
  const name = user?.name || 'Admin';
  if (h >= 5  && h < 12) return `Good Morning, ${name}! \uD83C\uDF05`;
  if (h >= 12 && h < 17) return `Good Afternoon, ${name}! \u2600\uFE0F`;
  if (h >= 17 && h < 21) return `Good Evening, ${name}! \uD83C\uDF06`;
  return `Good Night, ${name}! \uD83C\uDF19`;
}

/* ════════════════════════════════════════════════════════
   GLOBAL BOOT  (called by DOMContentLoaded on every page)
   ════════════════════════════════════════════════════════ */
function bootPage() {
  ThemeManager.init();
  SidebarManager.init();
  DateManager.init();
  ModalManager.init();
  ProfileDropdown.init();
  NotificationPanel.init();

  // Export button wiring
  document.querySelectorAll('[data-export="excel"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const pg = document.body.dataset.page;
      if      (pg === 'fees')       ExcelExporter.fees();
      else if (pg === 'attendance') ExcelExporter.attendance();
      else                          ExcelExporter.students();
    });
  });

  // Page-specific init
  const pg = document.body.dataset.page;
  if (pg === 'students')   StudentManager.init();
  if (pg === 'attendance') AttendanceManager.init();
  if (pg === 'fees')       FeeManager.init();
  if (pg === 'settings') {
    SettingsManager.load();
    StaffManager.render();
  }

  // Greeting
  const gr = document.getElementById('greetingText');
  if (gr) gr.textContent = getISTGreeting();
}

/* ════════════════════════════════════════════════════════
   GLOBAL ALIASES  (used from inline onclick HTML)
   ════════════════════════════════════════════════════════ */
window.AUTH               = AUTH;
window.StaffManager       = StaffManager;
window.SettingsManager    = SettingsManager;
window.FeeManager         = FeeManager;
window.ExcelExporter      = ExcelExporter;
window.AttendanceManager  = AttendanceManager;
window.StudentManager     = StudentManager;
window.ReceiptManager     = ReceiptManager;
window.ToastManager       = ToastManager;
window.ModalManager       = ModalManager;
window.openStudentModal   = (id) => StudentManager.openModal(id);
window.closeStudentModal  = ()   => StudentManager.closeModal();
window.saveStudent        = ()   => StudentManager.save();
window.generateReceiptFor = (id) => ReceiptManager.generate(id);
window.openModal          = (id) => ModalManager.open(id);
window.closeModal         = (id) => ModalManager.close(id);
window.showForgotPassword = ()   => showForgotPassword();

document.addEventListener("DOMContentLoaded",function(){
  AUTH.requireAuth();
  bootPage();
  document.getElementById('attDateLabel').textContent='Today: '+new Date().toLocaleDateString('en-IN',{{weekday:'long',year:'numeric',month:'long',day:'numeric'}});
});
</script>
</body></html>
